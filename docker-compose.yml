services:
  db:
    image: postgres:16-alpine
    container_name: sheep_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheep
      POSTGRES_PASSWORD: sheep
      POSTGRES_DB: sheep_portal
    # No host port on purpose: a PostgreSQL installed on the host often owns 5432 and would stop this
    # container from starting. Developers add the port with docker-compose.dev.yml (`npm run db:up`).
    volumes:
      - sheep_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheep -d sheep_portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: sheep_portal_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sheep:sheep@db:5432/sheep_portal?schema=public
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"

volumes:
  sheep_portal_pgdata:
